[package]
name = "eos_token_sanitizer"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust WASM AST token sanitizer and lexer for EOS"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
