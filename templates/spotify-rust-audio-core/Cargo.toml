[package]
name = "spotify-rust-audio-core"
version = "1.0.0"
edition = "2024"
authors = ["EOS Autonomous Agentic Factory <sre@spotify.com>"]
description = "Spotify-Grade High-Performance Lockless Ring Buffer & SIMD ITU-R BS.1770 Audio Normalizer"
license = "MIT"

[dependencies]

[lib]
name = "spotify_audio_core"
path = "src/lib.rs"

[[bin]]
name = "spotify_audio_bench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
