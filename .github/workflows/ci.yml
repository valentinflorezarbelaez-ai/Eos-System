name: EOS CI
# Fail-closed required checks: verify + test + syntax + governance-gates + seam-pack. No continue-on-error.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: true
  EOS_CI: github-actions

jobs:
  verify:
    name: Workspace verify (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Assert GitHub Actions contract
        run: node scripts/ci/assert-gha-contract.js
      - name: Strict workspace verification
        run: node scripts/verify-eos.js --strict
      - name: Fundacion freeze (delta 0)
        run: |
          git diff --exit-code -- Fundacion
          extra="$(git ls-files --others --exclude-standard -- Fundacion || true)"
          test -z "$extra"

  test:
    name: Node test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run control-plane tests (L0 builtins only)
        run: npm test
      - name: Discard ephemeral test writes
        if: always()
        run: git checkout -- EOS-MISSION-CONTROL/ACTIVE_TOOLS.json
      - name: Fundacion freeze (delta 0)
        run: |
          git diff --exit-code -- Fundacion
          extra="$(git ls-files --others --exclude-standard -- Fundacion || true)"
          test -z "$extra"

  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax-check JavaScript
        run: |
          find bin src scripts tests -name '*.js' -type f -print0 \
            | xargs -0 -n1 node --check
      - name: Fundacion freeze (delta 0)
        run: |
          git diff --exit-code -- Fundacion
          extra="$(git ls-files --others --exclude-standard -- Fundacion || true)"
          test -z "$extra"

  governance-gates:
    name: Local governance engines
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Evaluate release gates
        run: npm run evaluate:release
      - name: Independent verification harness
        run: npm run verify:independent
      - name: System-wide integrity audit
        run: npm run audit:system
      - name: Fundacion freeze (delta 0)
        run: |
          git diff --exit-code -- Fundacion
          extra="$(git ls-files --others --exclude-standard -- Fundacion || true)"
          test -z "$extra"

  seam-pack:
    name: CI GameDay / ROI seam pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: CI-safe long-run GameDay (default N)
        run: npm run gameday:long-run
      - name: Named ROI / Ladder seam pack (incl. N2-N6 + P2/P3/P4-P6 + Q2-Q6 + R4-R5 + S2-S6 + SpecBoot/AGY + T2-T8)
        run: |
          npm run test:roi3
          npm run test:roi4
          npm run test:roi5
          npm run test:roi6
          npm run test:m1
          npm run test:m2
          npm run test:m3
          npm run test:m4
          npm run test:n2
          npm run test:n3
          npm run test:n4
          npm run test:n5
          npm run test:n6
          npm run test:p2
          npm run test:p3
          npm run test:p4
          npm run test:p5
          npm run test:p6
          npm run test:q2
          npm run test:q3
          npm run test:q4
          npm run test:q5
          npm run test:q6
          npm run test:r4
          npm run test:r5
          npm run test:s2
          npm run test:s3
          npm run test:s4
          npm run test:s5
          npm run test:s6
          npm run test:specboot-agy
          npm run test:t2
          npm run test:t3
          npm run test:t4
          npm run test:t5
          npm run test:t6
          npm run test:t7
          npm run test:t8
      - name: Fundacion freeze (delta 0)
        run: |
          git diff --exit-code -- Fundacion
          extra="$(git ls-files --others --exclude-standard -- Fundacion || true)"
          test -z "$extra"
