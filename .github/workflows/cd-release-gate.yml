name: EOS CD Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - 'rc/*'

permissions:
  contents: read

concurrency:
  group: eos-cd-release-gate-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CI: true
  EOS_CI: github-actions
  EOS_CD_MODE: 'RELEASE_GATE_ONLY'
  EOS_PRODUCTION_DEPLOY: 'false'

jobs:
  release-gate:
    name: Evaluate release candidate (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Assert GitHub Actions contract
        run: node scripts/ci/assert-gha-contract.js
      - name: Strict workspace verification
        run: node scripts/verify-eos.js --strict
      - name: Control-plane tests (L0 builtins only)
        run: npm test
      - name: Discard ephemeral test writes
        if: always()
        run: git checkout -- EOS-MISSION-CONTROL/ACTIVE_TOOLS.json
      - name: Evaluate release engines
        run: npm run evaluate:release | tee "${RUNNER_TEMP}/release-eval.json"
      - name: Independent verification harness
        run: npm run verify:independent | tee "${RUNNER_TEMP}/independent-verify.json"
      - name: System-wide integrity audit
        run: npm run audit:system | tee "${RUNNER_TEMP}/system-audit.json"
      - name: Record non-deploy verdict
        run: |
          cat > "${RUNNER_TEMP}/cd-verdict.json" <<'EOF'
          {
            "mode": "RELEASE_GATE_ONLY",
            "production_deploy": false,
            "fundacion_mutation": false,
            "PRODUCTION_READY": "NO",
            "axiom": "CI_PASS_DOES_NOT_EQUAL_PRODUCTION_READY"
          }
          EOF
      - name: Upload release-gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eos-release-gate-evidence
          path: |
            ${{ runner.temp }}/release-eval.json
            ${{ runner.temp }}/independent-verify.json
            ${{ runner.temp }}/system-audit.json
            ${{ runner.temp }}/cd-verdict.json
      - name: Fundacion freeze (delta 0)
        run: |
          git diff --exit-code -- Fundacion
          extra="$(git ls-files --others --exclude-standard -- Fundacion || true)"
          test -z "$extra"
      - name: Refuse production deploy
        run: |
          echo "PRODUCTION_READY: NO — this workflow does not deploy."
          echo "No pages, packages, containers, or remote hosts are published."
          test "${EOS_PRODUCTION_DEPLOY}" = "false"
          test "${EOS_CD_MODE}" = "RELEASE_GATE_ONLY"
