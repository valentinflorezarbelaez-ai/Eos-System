name: EOS Spotify Honk Autonomous Background Agent

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task_directive:
        description: 'Directive for Honk Autonomous Agent'
        required: true
        default: 'Refactor audio ring buffer to zero-allocation SIMD kernel'
      target_stack:
        description: 'Target stack (rust | go | node | java)'
        required: false
        default: 'go'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  honk-agentic-loop:
    name: "Spotify Honk Autonomous Coding & Self-Healing Loop"
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '@honk')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Synchronize Xirp Context & Backstage Catalogs
        run: node bin/eos.mjs xirp sync

      - name: Verify Go Microservice Concurrency & Memory Benchmarks (FinOps Shift-Left)
        run: |
          cd templates/spotify-go-microservice
          go test -v -race -bench=. -benchmem .

      - name: Execute Honk Autonomous Coding & Test Loop
        id: honk_run
        run: |
          DIRECTIVE="${{ github.event.inputs.task_directive || github.event.comment.body }}"
          node bin/eos.mjs honk dispatch --directive "$DIRECTIVE"

      - name: Execute Sovereign Strict CI/CD SecDevOps Gate
        run: npm run verify:strict

      - name: Create or Update Autonomous Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="honk/autonomous-$(date +%s)"
          git config --global user.name "spotify-honk-agent[bot]"
          git config --global user.email "honk-agent@spotify.com"
          git checkout -b "$BRANCH_NAME"
          git add -A
          git commit -m "feat(honk): autonomous zero-touch implementation [skip ci]" || echo "No changes to commit"
          git push origin "$BRANCH_NAME"
          gh pr create --title "feat(honk): Autonomous Zero-Touch Implementation" \
                       --body "$(cat docs/evidence/HONK-PR-BODY.md || echo 'Autonomous Spotify Honk PR')" \
                       --base main --head "$BRANCH_NAME" || echo "PR creation handled"
