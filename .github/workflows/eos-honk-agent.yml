name: EOS Honk Local Plan

on:
  workflow_dispatch:
    inputs:
      task_directive:
        description: 'Task description for the local planner'
        type: string
        required: true
        default: 'Review the audio ring buffer design'

permissions:
  contents: read

jobs:
  honk-plan:
    name: "Generate a bounded local task plan"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Generate a redacted local planning report
        env:
          TASK_DIRECTIVE: ${{ inputs.task_directive }}
        run: node bin/eos.mjs honk --redact-directive --quiet "$TASK_DIRECTIVE"
