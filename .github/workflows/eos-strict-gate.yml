name: EOS Strict Sovereign Gate (SPEC-096)

on:
  workflow_call:
    inputs:
      fail-fast:
        description: 'Terminate immediately on first gate finding'
        required: false
        type: boolean
        default: true
      export-sarif:
        description: 'Export and upload OASIS SARIF v2.1.0 security receipt'
        required: false
        type: boolean
        default: true
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  eos-strict-attestation:
    name: EOS 7-Stage Strict Gate Attestation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Layer-0 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run EOS Criterial Gate Attestation
        run: |
          node scripts/eos-github-pr-attestation.mjs

      - name: Upload OASIS SARIF v2.1.0 Security Receipt
        if: ${{ inputs.export-sarif != false && !cancelled() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: docs/evidence/local-checks.sarif
